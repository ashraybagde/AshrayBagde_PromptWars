[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "D"]
ignore = ["D203", "D213", "D107", "D105", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "D", "E501"]
"app/prompts.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
